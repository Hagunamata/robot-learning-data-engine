# Validation thresholds for the batch quality gates.  (M1 — human-owned values.)
#
# Feature keys verified 2026-07-22 against lerobot/droid_100 meta/info.json (v3.0):
#   observation.state (7-d f32), action (7-d f32),
#   observation.images.{exterior_image_1_left, exterior_image_2_left, wrist_image_left}.
# NOTE: there is NO `language_instruction` column. The language instruction is a
#   per-frame `task_index` (int) resolved to a string via meta/tasks.parquet. The
#   annotation gate checks task presence via task_index -> tasks lookup at M3.
# Signal thresholds are DRAFT until the calibration pass over droid-100.
# See docs/01-conception.md §4.2/§4.3.

schema:
  detect_codebase_version: true   # branch v2.0 (flat) vs v3.0 (split keys)
  required_features:              # v2.0 / droid_100 keys
    - observation.state
    - action
  require_at_least_one_image: true
  image_keys_any_of:
    - observation.images.exterior_image_1_left
    - observation.images.exterior_image_2_left
    - observation.images.wrist_image_left

signal:
  calibrate_from: droid-100       # profiling pass sets thresholds ~ mean + 6σ
  jerk_zscore_max: 6.0            # DRAFT until calibrated
  action_outlier_zscore_max: 5.0  # DRAFT
  max_missing_frame_ratio: 0.02

annotation:
  require_language_instruction: true   # via per-frame task_index -> meta/tasks.parquet (v3.0)

policy:
  on_fail: quarantine             # keep rejects + reason
