# Validation thresholds for the batch quality gates.
#
# Feature keys verified 2026-07-22 against lerobot/droid_100 meta/info.json (v3.0):
#   observation.state (7-d f32), action (7-d f32),
#   observation.images.{exterior_image_1_left, exterior_image_2_left, wrist_image_left}.
# NOTE: there is NO `language_instruction` column. The language instruction is a
#   per-frame `task_index` (int) resolved to a string via meta/tasks.parquet. The
#   annotation gate checks task presence via task_index -> tasks lookup.
# Signal thresholds are provisional until the calibration pass over droid-100.

schema:
  detect_codebase_version: true   # branch v2.0 (flat) vs v3.0 (split keys)
  required_features:              # v2.0 / droid_100 keys
    - observation.state
    - action
  require_at_least_one_image: true
  image_keys_any_of:
    - observation.images.exterior_image_1_left
    - observation.images.exterior_image_2_left
    - observation.images.wrist_image_left

signal:
  # Robust percentile + anomalous-frame-fraction gate. Naive mean+kσ z-scores were too
  # aggressive on real DROID jerk (99/100 failed) because jerk is near-zero-peaked.
  # Instead: calibrate a
  # per-signal frame-score threshold at `anomaly_percentile` over `calibrate_from`,
  # then fail an episode only if >`max_anomalous_frame_ratio` of its frames exceed it.
  calibrate_from: droid-100       # source profiled to set the score thresholds
  anomaly_percentile: 99.9        # per-frame score threshold percentile
  max_anomalous_frame_ratio: 0.01 # fail if >1% of frames are anomalous
  max_missing_frame_ratio: 0.02

annotation:
  require_language_instruction: true   # via per-frame task_index -> meta/tasks.parquet (v3.0)

policy:
  on_fail: quarantine             # keep rejects + reason
