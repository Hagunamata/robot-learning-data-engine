# Logstash pipeline (M0 SKELETON).
#
# Ships structured stdout from every pipeline stage into Elasticsearch, including the
# running disk-used-vs-budget figure. Wired in with the ELK containers (M2+).
# Reused pattern from the prior repo's elk/logstash/. See docs/01-conception.md §4.7.

# input {
#   # container stdout (gelf / tcp / filebeat) — configured with the compose stack
# }
#
# filter {
#   # parse the JSON log lines emitted by acquisition / ingest / spark jobs
# }
#
# output {
#   # elasticsearch { hosts => ["elasticsearch:9200"] index => "rlde-%{+YYYY.MM.dd}" }
# }
